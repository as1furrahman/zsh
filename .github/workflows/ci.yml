name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck and Zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh

      - name: Run ShellCheck on install.sh
        run: |
          shellcheck install.sh

      - name: Validate Zsh syntax (zsh -n)
        run: |
          for f in *.zsh .zshenv .zshrc system/etc/zsh/*; do
            if [ -f "$f" ]; then
              zsh -n "$f"
              echo "Syntax OK: $f"
            fi
          done

  test-ubuntu:
    name: Test Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh git curl fzf bat fd-find ripgrep

      - name: Test installer dry-run
        run: |
          ./install.sh --dry-run

      - name: Test installer config
        run: |
          ./install.sh --config

      - name: Test shell startup
        run: |
          zsh -i -c 'echo "Ubuntu Shell OK"'

      - name: Test keybindings
        run: |
          zsh -i -c 'zvm_init; bindkey -M viins "^F"; bindkey -M vicmd "k"'

  test-arch:
    name: Test Arch Linux
    runs-on: ubuntu-latest
    container: "archlinux:latest"
    steps:
      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm git zsh fzf ripgrep fd bat

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test installer dry-run
        run: |
          ./install.sh --dry-run

      - name: Test installer config
        run: |
          ./install.sh --config

      - name: Test shell startup
        run: |
          zsh -i -c 'echo "Arch Linux Shell OK"'

      - name: Test keybindings
        run: |
          zsh -i -c 'zvm_init; bindkey -M viins "^F"; bindkey -M vicmd "k"'

  test-fedora:
    name: Test Fedora
    runs-on: ubuntu-latest
    container: "fedora:latest"
    steps:
      - name: Install Fedora dependencies
        run: |
          dnf install -y git zsh fzf ripgrep fd-find bat util-linux-user

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test installer dry-run
        run: |
          ./install.sh --dry-run

      - name: Test installer config
        run: |
          ./install.sh --config

      - name: Test shell startup
        run: |
          zsh -i -c 'echo "Fedora Shell OK"'

      - name: Test keybindings
        run: |
          zsh -i -c 'zvm_init; bindkey -M viins "^F"; bindkey -M vicmd "k"'
